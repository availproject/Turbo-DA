image = "registry.digitalocean.com/availj/turboda-data-submission"

[network]
port = 8080

[deploy]
health_path = "/health"
chart_version = 131

[resources]
cpu_request = "20m"
memory_request = "64Mi"
memory_limit = "512Mi"

[env]
OTLP_RECEIVER_URL = "http://unified-otel.avail.so:4317"
ENABLE_OTEL_METRICS = "true"
ENABLE_OTEL_TRACING = "false"
ENIGMA_ENCRYPTION_SERVICE_VERSION = "/enigma-encrypted-network/1.0.0"
ASSIGNED_WALLET = "0x53Ba580C12745FdFb6b5Ad5f32F33C1bbf26F112"
COINGECKO_API_URL = "https://pro-api.coingecko.com/api/v3/simple/price"
AVAIL_RPC_ENDPOINT_1 = "https://infinity-hex-hetzner-rpc.avail.tools/ws"
AVAIL_RPC_ENDPOINT_2 = "https://infinity-hex-hetzner-rpc.avail.tools/ws"
AVAIL_RPC_ENDPOINT_3 = "https://infinity-hex-hetzner-rpc.avail.tools/ws"
PORT = "8080"
NUMBER_OF_THREADS = "20"
RATE_LIMIT_MAX_REQUESTS = "5000"
RATE_LIMIT_WINDOW_SIZE = "60"
CONNECTION_ITERATION_ATTEMPS = "5"
TOTAL_USERS_QUERY_LIMIT = "2"
MAX_POOL_SIZE = "10"
BROADCAST_CHANNEL_SIZE = "20"
PAYLOAD_SIZE = "10485760"
MAXIMUM_PENDING_REQUESTS = "10"

[secrets]
DATABASE_URL = "/turboda/devnet/shared/DATABASE_URL"
DATABASE_CA_CERT = "/turboda/devnet/shared/DATABASE_CA_CERT"
REDIS_URL = "/turboda/devnet/shared/REDIS_URL"
ENIGMA_URL = "/turboda/devnet/shared/ENIGMA_URL"
ENIGMA_ENCRYPTION_SERVICE_URL = "/turboda/devnet/shared/ENIGMA_ENCRYPTION_SERVICE_URL"
COINGECKO_API_KEY = "/turboda/devnet/shared/COINGECKO_API_KEY"
FAILURE_PRIVATE_KEY = "/turboda/devnet/shared/FALLBACK_SIGNING_KEY"
SIGNING_KEY = "/turboda/devnet/shared/FALLBACK_SIGNING_KEY"
CA_CRT = "/turboda/devnet/shared/CA_CRT"
CLIENT_KEY = "/turboda/devnet/shared/CLIENT_KEY"
CLIENT_CRT = "/turboda/devnet/shared/CLIENT_CRT"

PRIVATE_KEY_0 = "/turboda/devnet/data-submission-1/PRIVATE_KEY_0"
PRIVATE_KEY_1 = "/turboda/devnet/data-submission-1/PRIVATE_KEY_1"
PRIVATE_KEY_2 = "/turboda/devnet/data-submission-1/PRIVATE_KEY_2"
