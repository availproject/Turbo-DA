image = "registry.digitalocean.com/availj/turboda-fallback-monitor"

[network]
port = 8080

[resources]
cpu_request = "25m"
cpu_limit = "50m"
memory_request = "64Mi"
memory_limit = "256Mi"

[env]
ENABLE_OTEL_METRICS = "true"
ENABLE_OTEL_TRACING = "false"
ENIGMA_URL = "https://8f724c6e23ead7514d0ee022d61170e5c9c15ab5-3000s.dstack-base-prod7.phala.network"
RETRY_COUNT = "10"
LIMIT = "6"
AVAIL_RPC_ENDPOINT_1 = "https://infinity-turing-rpc.avail.so/rpc"

[secrets]
DATABASE_URL = "/turboda/testnet/shared/DATABASE_URL"
DATABASE_CA_CERT = "/turboda/testnet/shared/DATABASE_CA_CERT"
PRIVATE_KEY_0 = "/turboda/testnet/fallback-monitor/PRIVATE_KEY_0"
PRIVATE_KEY_1 = "/turboda/testnet/fallback-monitor/PRIVATE_KEY_1"
PRIVATE_KEY_2 = "/turboda/testnet/fallback-monitor/PRIVATE_KEY_2"
PRIVATE_KEY_3 = "/turboda/testnet/fallback-monitor/PRIVATE_KEY_3"
PRIVATE_KEY_4 = "/turboda/testnet/fallback-monitor/PRIVATE_KEY_4"
PRIVATE_KEY_5 = "/turboda/testnet/fallback-monitor/PRIVATE_KEY_5"
REDIS_URL = "/turboda/testnet/shared/REDIS_URL"
COINGECKO_API_URL = "/turboda/testnet/shared/COINGECKO_API_URL"
COINGECKO_API_KEY = "/turboda/testnet/shared/COINGECKO_API_KEY"
CA_CRT = "/turboda/testnet/shared/CA_CRT"
CLIENT_KEY = "/turboda/testnet/shared/CLIENT_KEY"
CLIENT_CRT = "/turboda/testnet/shared/CLIENT_CRT"
