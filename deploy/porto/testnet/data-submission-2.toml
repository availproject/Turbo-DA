image = "registry.digitalocean.com/availj/turboda-data-submission"

[network]
port = 8080

[deploy]
health_path = "/health"
chart_version = 131

[resources]
cpu_request = "500m"
cpu_limit = "1500m"
memory_request = "1800Mi"
memory_limit = "2304Mi"

[env]
ENABLE_OTEL_METRICS = "true"
ENABLE_OTEL_TRACING = "true"
ENIGMA_ENCRYPTION_SERVICE_VERSION = "/enigma-encrypted-network/1.0.0"
COINGECKO_API_URL = "https://pro-api.coingecko.com/api/v3/simple/price"
PORT = "8080"
NUMBER_OF_THREADS = "20"
MAX_POOL_SIZE = "30"
BROADCAST_CHANNEL_SIZE = "1000000"
PAYLOAD_SIZE = "10000000"
MAXIMUM_PENDING_REQUESTS = "50"
RATE_LIMIT_MAX_REQUESTS = "5000"
RATE_LIMIT_WINDOW_SIZE = "60"
AVAIL_RPC_ENDPOINT_1 = "https://turing-rpc.avail.so/rpc"
AVAIL_RPC_ENDPOINT_2 = "https://turing-rpc.avail.so/rpc"
AVAIL_RPC_ENDPOINT_3 = "https://turing-rpc.avail.so/rpc"

[secrets]
DATABASE_URL = "/turboda/testnet/shared/DATABASE_URL"
DATABASE_CA_CERT = "/turboda/testnet/shared/DATABASE_CA_CERT"
REDIS_URL = "/turboda/testnet/shared/REDIS_URL"
ENIGMA_URL = "/turboda/testnet/shared/ENIGMA_URL"
ENIGMA_ENCRYPTION_SERVICE_URL = "/turboda/testnet/shared/ENIGMA_ENCRYPTION_SERVICE_URL"
COINGECKO_API_KEY = "/turboda/testnet/shared/COINGECKO_API_KEY"
CA_CRT = "/turboda/testnet/shared/CA_CRT"
CLIENT_KEY = "/turboda/testnet/shared/CLIENT_KEY"
CLIENT_CRT = "/turboda/testnet/shared/CLIENT_CRT"
PRIVATE_KEY_0 = "/turboda/testnet/data-submission-2/PRIVATE_KEY_0"
