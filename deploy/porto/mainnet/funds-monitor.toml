image = "registry.digitalocean.com/availj/turboda-funds-monitor"

[network]
port = 8080

[resources]
cpu_request = "25m"
cpu_limit = "50m"
memory_request = "32Mi"
memory_limit = "64Mi"

[env]
NETWORK_BASE_CONTRACT_ADDRESS = "0x5f02ED27A20BbDbB90EEf98670fA36c36fc02D12"
AVAIL_DEPOSIT_ADDRESS = "5EDAzYNAu561hN837GPZnfAjUh61vEJZFg3Sqyx9HzfHpccY"
ENABLE_OTEL_METRICS = "true"
ENABLE_OTEL_TRACING = "false"
MAXIMUM_PENDING_REQUESTS = "100"
NETWORK_BASE_CHAIN_ID = "8453"
AVAIL_RPC_URL = "https://mainnet-rpc.avail.so/rpc"

[secrets]
DATABASE_URL = "/turboda/mainnet/shared/DATABASE_URL"
DATABASE_CA_CERT = "/turboda/mainnet/shared/DATABASE_CA_CERT"
COINGECKO_API_URL = "/turboda/mainnet/shared/COINGECKO_API_URL"
COINGECKO_API_KEY = "/turboda/mainnet/shared/COINGECKO_API_KEY"
NETWORK_BASE_URL = "/turboda/mainnet/funds-monitor/NETWORK_BASE_URL"
NETWORK_BASE_WS_URL = "/turboda/mainnet/funds-monitor/NETWORK_BASE_WS_URL"
